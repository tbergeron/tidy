name: Tidy
options:
  deploymentTarget:
    macOS: "27.0"
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # macOS Debug builds (also the test host) must not share the real app's widget data or tidy:// links.
    TIDY_DISPLAY_NAME: Tidy Dev
    TIDY_APP_GROUP: $(TeamIdentifierPrefix)com.brainpad.tidy.dev
    TIDY_URL_SCHEME: tidy-dev
    DEVELOPMENT_TEAM: $(TIDY_TEAM)
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    CLANG_ENABLE_OBJC_ARC: YES
  configs:
    Release:
      TIDY_DISPLAY_NAME: Tidy
      TIDY_APP_GROUP: $(TeamIdentifierPrefix)com.brainpad.tidy
      TIDY_URL_SCHEME: tidy
targets:
  Tidy:
    type: application
    platform: macOS
    sources: [Shared, App]
    configFiles:
      Debug: Config/Tidy.xcconfig
      Release: Config/Tidy.xcconfig
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: $(TIDY_DISPLAY_NAME)
        LSApplicationCategoryType: public.app-category.productivity
        NSRemindersFullAccessUsageDescription: "Tidy shows and edits your Apple Reminders."
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.tidyreminders.items
            UTTypeConformsTo: [public.data]
            UTTypeDescription: Reminders items
        CFBundleURLTypes:
          - CFBundleURLName: com.tidyreminders.app
            CFBundleURLSchemes: [$(TIDY_URL_SCHEME)]
        TidyAppGroup: $(TIDY_APP_GROUP)
        TidyURLScheme: $(TIDY_URL_SCHEME)
    entitlements:
      path: Support/App.entitlements
      properties:
        com.apple.security.personal-information.calendars: true
        com.apple.security.application-groups: [$(TIDY_APP_GROUP)]
    dependencies:
      - target: TidyMacWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tidyreminders.app.dev
        CODE_SIGN_IDENTITY: $(TIDY_DEBUG_IDENTITY)
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridge/TTRBridge.h
        ENABLE_RESOURCE_ACCESS_CALENDARS: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.tidyreminders.app
          CODE_SIGN_IDENTITY: $(TIDY_RELEASE_IDENTITY)
          OTHER_CODE_SIGN_FLAGS: $(TIDY_RELEASE_SIGN_FLAGS)
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  TidyMacWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared/Model.swift, Shared/Logic.swift, Shared/EKMap.swift]
    configFiles:
      Debug: Config/Tidy.xcconfig
      Release: Config/Tidy.xcconfig
    info:
      path: Support/MacWidget-Info.plist
      properties:
        CFBundleDisplayName: $(TIDY_DISPLAY_NAME)
        NSRemindersFullAccessUsageDescription: "Tidy shows and edits your Apple Reminders."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        TidyAppGroup: $(TIDY_APP_GROUP)
        TidyURLScheme: $(TIDY_URL_SCHEME)
    entitlements:
      path: Support/MacWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.application-groups: [$(TIDY_APP_GROUP)]
    settings:
      base:
        PRODUCT_NAME: TidyWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.tidyreminders.app.dev.widget
        CODE_SIGN_IDENTITY: $(TIDY_DEBUG_IDENTITY)
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_RESOURCE_ACCESS_CALENDARS: YES
        SWIFT_VERSION: "5.0"
      configs:
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.tidyreminders.app.widget
          CODE_SIGN_IDENTITY: $(TIDY_RELEASE_IDENTITY)
          OTHER_CODE_SIGN_FLAGS: $(TIDY_RELEASE_SIGN_FLAGS)
  TidyiOS:
    type: application
    platform: iOS
    sources: [Shared, iOS]
    configFiles:
      Debug: Config/Tidy.xcconfig
      Release: Config/Tidy.xcconfig
    info:
      path: Support/iOS-Info.plist
      properties:
        CFBundleDisplayName: Tidy
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        NSRemindersFullAccessUsageDescription: "Tidy shows and edits your Apple Reminders."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: com.brainpad.tidy
            CFBundleURLSchemes: [tidy]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.tidyreminders.items
            UTTypeConformsTo: [public.data]
            UTTypeDescription: Reminders items
        ITSAppUsesNonExemptEncryption: false
        TidyAppGroup: group.com.brainpad.tidy
        TidyURLScheme: tidy
    entitlements:
      path: Support/iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brainpad.tidy]
    dependencies:
      - target: TidyWidget
    settings:
      base:
        PRODUCT_NAME: Tidy
        PRODUCT_BUNDLE_IDENTIFIER: com.brainpad.tidy
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Bridge/TTRBridge.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
  TidyWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared/Model.swift, Shared/Logic.swift, Shared/EKMap.swift]
    configFiles:
      Debug: Config/Tidy.xcconfig
      Release: Config/Tidy.xcconfig
    info:
      path: Support/Widget-Info.plist
      properties:
        CFBundleDisplayName: Tidy
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSRemindersFullAccessUsageDescription: "Tidy shows and edits your Apple Reminders."
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        TidyAppGroup: group.com.brainpad.tidy
        TidyURLScheme: tidy
    entitlements:
      path: Support/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brainpad.tidy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brainpad.tidy.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        SWIFT_VERSION: "5.0"
  Tests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    configFiles:
      Debug: Config/Tidy.xcconfig
      Release: Config/Tidy.xcconfig
    dependencies:
      - target: Tidy
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Tidy.app/Contents/MacOS/Tidy"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: $(TIDY_DEBUG_IDENTITY)
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tidyreminders.tests
schemes:
  Tidy:
    build:
      targets:
        Tidy: all
        Tests: [test]
    test:
      targets: [Tests]
  TidyiOS:
    build:
      targets:
        TidyiOS: all
